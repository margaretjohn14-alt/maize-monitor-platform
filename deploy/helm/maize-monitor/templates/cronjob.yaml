apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-update
spec:
  schedule: {{ .Values.update.schedule | quote }}
  timeZone: {{ .Values.update.timeZone | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: update
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "app.update"]