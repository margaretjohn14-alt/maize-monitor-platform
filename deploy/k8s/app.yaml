apiVersion: apps/v1
kind: Deployment
metadata:
  name: maize-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maize-monitor
  template:
    metadata:
      labels:
        app: maize-monitor
    spec:
      containers:
        - name: api
          image: maize-monitor:dev
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: maize-monitor
spec:
  selector:
    app: maize-monitor
  ports:
    - port: 80
      targetPort: 8000