apiVersion: batch/v1
kind: CronJob
metadata:
  name: maize-update
spec:
  schedule: "0 6 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: update
              image: maize-monitor:dev
              command: ["python", "-m", "app.update"]